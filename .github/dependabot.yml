version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 2.0.1 is missing its published bundles and type declarations. Upgrade
      # manually after upstream publishes and verifies a repaired release.
      - dependency-name: json-canonicalize
        versions: ["2.0.1"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
